name: Test working-directory input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PHP and Composer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring
          php -v
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Set up fixture in subdirectory
        run: |
          mkdir -p /tmp/test-workdir/myapp
          cp tests/fixtures/subdir/myapp/composer.json /tmp/test-workdir/myapp/composer.json

      - id: action
        uses: .
        with:
          dependency-versions: highest
          working-directory: /tmp/test-workdir/myapp

      - name: Assert vendor directory exists in subdirectory
        run: |
          if [ ! -d "/tmp/test-workdir/myapp/vendor" ]; then
            echo "FAIL: vendor directory not found at /tmp/test-workdir/myapp/vendor"
            exit 1
          fi
          echo "PASS: vendor directory exists in subdirectory"

      - name: Assert autoload file exists in subdirectory
        run: |
          if [ ! -f "/tmp/test-workdir/myapp/vendor/autoload.php" ]; then
            echo "FAIL: autoload.php not found in subdirectory"
            exit 1
          fi
          echo "PASS: autoload.php exists in subdirectory"
