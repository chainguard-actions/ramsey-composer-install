name: Test locked dependencies (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PHP and Composer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring php-xml php-curl
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - id: action
        uses: .
        with:
          dependency-versions: locked
          ignore-cache: "yes"
          working-directory: tests/fixtures/with-lock-file

      - name: Assert vendor directory was created
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/tests/fixtures/with-lock-file/vendor" ]; then
            echo "FAIL: vendor directory not found"
            exit 1
          fi
          echo "PASS: vendor directory exists"

      - name: Assert ehime/hello-world was installed
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/tests/fixtures/with-lock-file/vendor/ehime/hello-world" ]; then
            echo "FAIL: ehime/hello-world package not found in vendor"
            exit 1
          fi
          echo "PASS: ehime/hello-world installed"
