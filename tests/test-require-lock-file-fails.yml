name: Test require-lock-file fails when no lock file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-xml php-curl
          php --version

      - name: Set up Composer from fixture phar
        run: |
          sudo cp "${GITHUB_WORKSPACE}/tests/fixtures/composer.phar" /usr/local/bin/composer
          sudo chmod +x /usr/local/bin/composer
          composer --version

      - id: action
        uses: .
        continue-on-error: true
        with:
          dependency-versions: locked
          require-lock-file: "true"
          ignore-cache: "true"
          working-directory: ${{ github.workspace }}/tests/fixtures/no-lock-file

      - name: Assert action failed when lock file is required but missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-lock-file=true and no lock file exists"
            exit 1
          fi
          echo "PASS: action correctly failed when lock file was required but missing"
