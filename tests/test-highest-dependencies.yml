name: Test highest dependency versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-xml php-curl
          php --version

      - name: Set up Composer from fixture phar
        run: |
          sudo cp "${GITHUB_WORKSPACE}/tests/fixtures/composer.phar" /usr/local/bin/composer
          sudo chmod +x /usr/local/bin/composer
          composer --version

      - id: action
        uses: .
        with:
          dependency-versions: highest
          ignore-cache: "true"
          working-directory: ${{ github.workspace }}/tests/fixtures/with-lock-file

      - name: Assert vendor directory was created
        run: |
          dir="${GITHUB_WORKSPACE}/tests/fixtures/with-lock-file/vendor"
          echo "Checking for vendor directory at: $dir"
          if [ ! -d "$dir" ]; then
            echo "FAIL: vendor directory not found at $dir"
            exit 1
          fi
          echo "PASS: vendor directory exists"

      - name: Assert ehime/hello-world was installed
        run: |
          pkg="${GITHUB_WORKSPACE}/tests/fixtures/with-lock-file/vendor/ehime/hello-world"
          echo "Checking for package at: $pkg"
          if [ ! -d "$pkg" ]; then
            echo "FAIL: ehime/hello-world package not found"
            exit 1
          fi
          echo "PASS: ehime/hello-world package installed"
