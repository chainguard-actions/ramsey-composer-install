name: Test highest dependency versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP and Composer
        run: |
          php --version || (sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-xml php-mbstring)
          composer --version || (curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer)

      - name: Prepare composer.json in workspace root
        run: |
          cp tests/fixtures/composer-no-lock/composer.json "$GITHUB_WORKSPACE/composer.json"

      - id: action
        uses: .
        with:
          dependency-versions: "highest"
          composer-options: "--no-scripts"
          ignore-cache: "true"

      - name: Assert composer update ran (no lock file, highest)
        run: |
          echo "Composer install with highest dependencies completed successfully"
          echo "PASS"
