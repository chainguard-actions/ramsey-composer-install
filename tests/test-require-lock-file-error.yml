name: Test require-lock-file error when no lock file exists
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PHP and Composer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring php-xml php-curl
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - id: action
        uses: .
        continue-on-error: true
        with:
          dependency-versions: locked
          require-lock-file: "true"
          ignore-cache: "yes"
          working-directory: tests/fixtures/no-lock-file

      - name: Assert action failed when lock file is required but missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-lock-file=true and no lock file exists"
            exit 1
          fi
          echo "PASS: action correctly failed when lock file was required but missing"
