name: Test ignore-cache option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PHP and Composer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring
          php -v
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Set up fixture
        run: |
          mkdir -p /tmp/test-ignore-cache
          cp tests/fixtures/basic/composer.json /tmp/test-ignore-cache/composer.json

      - id: action
        uses: .
        with:
          dependency-versions: highest
          ignore-cache: "yes"
          working-directory: /tmp/test-ignore-cache

      - name: Assert vendor directory exists
        run: |
          if [ ! -d "/tmp/test-ignore-cache/vendor" ]; then
            echo "FAIL: vendor directory not found at /tmp/test-ignore-cache/vendor"
            exit 1
          fi
          echo "PASS: vendor directory exists"

      - name: Assert autoload file exists
        run: |
          if [ ! -f "/tmp/test-ignore-cache/vendor/autoload.php" ]; then
            echo "FAIL: autoload.php not found"
            exit 1
          fi
          echo "PASS: autoload.php exists"
